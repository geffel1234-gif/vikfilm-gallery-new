<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VikFilm – Galerie bearbeiten</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#20201e;font:14px Arial}.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e4e1db;padding:24px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font:14px Arial;letter-spacing:.22em;margin-bottom:28px}.brand b{display:block}.ey{font-size:10px;letter-spacing:.2em;color:#999;margin:24px 0 10px}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav button{border:1px solid #ddd;background:#fff;padding:9px 11px;cursor:pointer}.nav button.active{background:#222;color:#fff}.control{margin:14px 0}.control label{display:block;font-size:11px;color:#777;margin-bottom:6px}.control select,.control input[type=text],.control input[type=number]{width:100%;padding:10px;border:1px solid #ddd;background:#fff}.control input[type=range]{width:100%}.check{display:flex;gap:8px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid #d7d3cb;background:#fff;padding:10px 13px;cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}.main{padding:28px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title{font:36px Georgia,serif;margin:0}.muted{color:#888}.preview{background:#fff;border:1px solid #e1ddd6;min-height:760px}.hero{height:350px;background:linear-gradient(135deg,#ad9984,#5e554d);display:grid;place-items:center;text-align:center;color:#fff;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0;background:rgba(0,0,0,var(--overlay,.22))}.heroContent{position:relative;z-index:2}.hero h1{font-family:Georgia;font-size:68px;font-weight:400;margin:10px 0}.hero .date{letter-spacing:.3em;font-size:10px}.hero .cta{display:inline-block;margin-top:18px;border:1px solid #fff;padding:10px 16px;font-size:10px;letter-spacing:.15em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px}.photo{height:190px;background:linear-gradient(135deg,#c7b7a6,#71675e);transition:.5s}.photo:nth-child(2n){height:250px}.photo:hover{transform:scale(1.025)}.fadeup .photo{animation:up .7s both}.fadeup .photo:nth-child(2){animation-delay:.08s}.fadeup .photo:nth-child(3){animation-delay:.16s}.fadeup .photo:nth-child(4){animation-delay:.24s}.slowzoom .hero{animation:zoom 6s both}.slide .heroContent{animation:slide .8s both}@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}@keyframes slide{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}.panel{display:none}.panel.active{display:block}.switches{border-top:1px solid #eee;margin-top:15px;padding-top:10px}.status{padding:7px 9px;background:#f0eee9;font-size:10px;letter-spacing:.12em}.saved{font-size:11px;color:#777;margin-left:8px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:12px}.hero{height:300px}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}.photo,.photo:nth-child(2n){height:240px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><b>VIKFILM</b><span>STUDIO</span></div><div class="ey">GALERIE</div><div class="control"><label>Kunde</label><input id="client" type="text" value="Julia & Kosta" oninput="render()"></div><div class="control"><label>Event</label><input id="date" type="text" value="8. August 2026" oninput="render()"></div><div class="nav"><button class="active" onclick="panel('design',this)">Design</button><button onclick="panel('content',this)">Inhalt</button><button onclick="panel('features',this)">Funktionen</button></div><div id="design" class="panel active"><div class="ey">DESIGN</div><div class="control"><label>Vorlage</label><select id="preset" onchange="preset(this.value)"><option value="custom">Eigene</option><option value="editorial">Editorial</option><option value="luxury">Luxury</option><option value="minimal">Minimal</option><option value="wedding">Wedding</option></select></div><div class="control"><label>Schriftart</label><select id="font" onchange="render()"><option value="Georgia">Elegant Serif</option><option value="Arial">Modern Sans</option><option value="Times New Roman">Classic</option><option value="cursive">Handwritten</option></select></div><div class="control"><label>Titelgröße</label><input id="size" type="range" min="36" max="90" value="68" oninput="render()"></div><div class="control"><label>Hero-Höhe</label><input id="height" type="range" min="220" max="520" value="350" oninput="render()"></div><div class="control"><label>Overlay</label><input id="overlay" type="range" min="0" max="60" value="22" oninput="render()"></div><div class="control"><label>Galerie-Layout</label><select id="layout" onchange="render()"><option value="4">4 Spalten</option><option value="3">3 Spalten</option><option value="2">2 Spalten</option><option value="5">5 Spalten</option></select></div><div class="control"><label>Bildabstand</label><input id="gap" type="range" min="0" max="28" value="8" oninput="render()"></div><div class="control"><label>Animation</label><select id="animation" onchange="render()"><option value="none">Keine</option><option value="fadeup">Fade Up</option><option value="slowzoom">Slow Zoom</option><option value="slide">Slide</option></select></div></div><div id="content" class="panel"><div class="ey">INHALT</div><div class="control"><label>Hero-Titel</label><input id="heroTitle" type="text" value="JULIA & KOSTA" oninput="render()"></div><div class="control"><label>Button-Text</label><input id="cta" type="text" value="FOTOS ANZEIGEN" oninput="render()"></div><div class="actions"><button class="btn" onclick="alert('Hier kommt später der echte Foto-Manager hinein.')">＋ Fotos hinzufügen</button><button class="btn" onclick="alert('Cover-Auswahl kommt mit dem echten Bildspeicher.')">Cover auswählen</button></div></div><div id="features" class="panel"><div class="ey">KUNDENFUNKTIONEN</div><label class="check"><input id="fav" type="checkbox" checked> Favoriten</label><label class="check"><input id="down" type="checkbox" checked> Download</label><label class="check"><input id="share" type="checkbox" checked> Teilen</label><label class="check"><input id="slideshow" type="checkbox" checked> Diashow</label><label class="check"><input id="comments" type="checkbox"> Kommentare</label><label class="check"><input id="watermark" type="checkbox"> Wasserzeichen</label><div class="ey">ZUGRIFF</div><div class="control"><label>Passwort</label><input type="text" placeholder="optional"></div></div><div class="actions"><button class="btn primary" onclick="save()">Speichern</button><button class="btn" onclick="openClient()">Kundenvorschau</button><span id="saved" class="saved"></span></div></aside><main class="main"><div class="top"><div><p class="ey muted">GALERIE BEARBEITEN</p><h1 class="title">Julia & Kosta</h1><p class="muted">Live-Vorschau – Änderungen werden sofort angezeigt</p></div><span class="status">ENTWURF</span></div><section class="preview" id="preview"><div class="hero"><div class="heroContent"><div class="date" id="pdate">8. AUGUST 2026</div><h1 id="ptitle">JULIA & KOSTA</h1><span class="cta" id="pcta">FOTOS ANZEIGEN</span></div></div><div class="grid" id="grid"></div></section></main></div><script>const $=x=>document.getElementById(x);function render(){let p=$('preview'),h=p.querySelector('.hero'),g=$('grid');$('ptitle').textContent=$('heroTitle').value;$('pdate').textContent=$('date').value.toUpperCase();$('pcta').textContent=$('cta').value;h.style.height=$('height').value+'px';h.style.setProperty('--overlay',$('overlay').value/100);$('ptitle').style.fontFamily=$('font').value;$('ptitle').style.fontSize=$('size').value+'px';g.style.gridTemplateColumns=`repeat(${$('layout').value},1fr)`;g.style.gap=$('gap').value+'px';p.className='preview '+$('animation').value;document.querySelector('.title').textContent=$('client').value;for(let i=0;i<12;i++){if(!g.children[i]){let d=document.createElement('div');d.className='photo';g.appendChild(d)}}}function panel(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function preset(v){if(v==='editorial'){font.value='Georgia';size.value=68;height.value=350;overlay.value=22;layout.value='4';gap.value=8;animation.value='fadeup'}if(v==='luxury'){font.value='Georgia';size.value=78;height.value=430;overlay.value=30;layout.value='3';gap.value=14;animation.value='slowzoom'}if(v==='minimal'){font.value='Arial';size.value=52;height.value=300;overlay.value=12;layout.value='4';gap.value=4;animation.value='none'}if(v==='wedding'){font.value='cursive';size.value=62;height.value=380;overlay.value=25;layout.value='3';gap.value=10;animation.value='fadeup'}render()}function save(){let d={client:client.value,date:date.value,font:font.value,size:size.value,height:height.value,overlay:overlay.value,layout:layout.value,gap:gap.value,animation:animation.value,title:heroTitle.value,cta:cta.value,fav:fav.checked,down:down.checked,share:share.checked,slideshow:slideshow.checked,comments:comments.checked,watermark:watermark.checked};localStorage.setItem('vikfilmGalleryDesign',JSON.stringify(d));saved.textContent='✓ Gespeichert'}function openClient(){location.href='index.html'}render()</script></body></html>
