<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VikFilm Gallery Builder</title><style>body{margin:0;font:14px Arial;color:#222;background:#f7f6f3}.app{display:grid;grid-template-columns:320px 1fr;height:100vh}.panel{background:#fff;border-right:1px solid #ddd;padding:24px;overflow:auto}.preview{padding:30px;overflow:auto}.h{font:32px Georgia;margin:0 0 6px}.muted{color:#888}.group{border-top:1px solid #e5e2dc;padding:18px 0}.group h3{font-size:11px;letter-spacing:.18em}.row{margin:12px 0}.row label{display:block;font-size:11px;color:#777;margin-bottom:5px}select,input{width:100%;padding:10px;border:1px solid #ddd;background:white;box-sizing:border-box}.checks label{display:flex;gap:8px;align-items:center;margin:10px 0}.checks input{width:auto}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ccc;background:#fff;padding:10px 13px;cursor:pointer}.dark{background:#222;color:#fff}.hero{height:330px;background:linear-gradient(135deg,#a9927b,#554a42);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.22)}.hero-content{position:relative;z-index:1}.hero h1{font:64px Georgia;margin:10px}.hero p{letter-spacing:.25em}.gallery{padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photo{height:190px;background:linear-gradient(135deg,#c5b4a0,#73675c);transition:.5s}.photo:nth-child(2n){height:260px}.photo:hover{transform:scale(1.025)}.fadeup .photo{animation:up .7s both}.zoom .hero{animation:zoom 5s both}.slide .hero-content{animation:slide .8s both}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.06)}}@keyframes slide{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@media(max-width:900px){.app{grid-template-columns:260px 1fr}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.panel{height:auto}.preview{padding:12px}.hero h1{font-size:40px}.gallery{grid-template-columns:1fr;padding:10px}}</style></head><body><div class="app"><aside class="panel"><h1 class="h">VikFilm</h1><p class="muted">Gallery Builder</p><div class="group"><h3>VORLAGEN</h3><div class="buttons"><button class="btn" onclick="preset('editorial')">Editorial</button><button class="btn" onclick="preset('luxury')">Luxury</button><button class="btn" onclick="preset('minimal')">Minimal</button><button class="btn" onclick="preset('wedding')">Wedding</button></div></div><div class="group"><h3>SCHRIFT</h3><div class="row"><label>Schriftart</label><select id="font" onchange="apply()"><option value="Georgia">Elegant Serif</option><option value="Arial">Modern Sans</option><option value="'Times New Roman'">Classic</option><option value="cursive">Handwritten</option></select></div><div class="row"><label>Titelgröße</label><input id="size" type="range" min="38" max="90" value="64" oninput="apply()"></div></div><div class="group"><h3>HERO</h3><div class="row"><label>Overlay</label><input id="overlay" type="range" min="0" max="60" value="22" oninput="apply()"></div><div class="row"><label>Hero-Höhe</label><input id="heroHeight" type="range" min="220" max="520" value="330" oninput="apply()"></div></div><div class="group"><h3>LAYOUT</h3><div class="row"><label>Spalten</label><select id="cols" onchange="apply()"><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div><div class="row"><label>Abstand</label><input id="gap" type="range" min="0" max="30" value="8" oninput="apply()"></div></div><div class="group"><h3>ANIMATION</h3><div class="row"><label>Galerie</label><select id="anim" onchange="apply()"><option value="none">Keine</option><option value="fadeup">Fade Up</option><option value="zoom">Slow Zoom</option><option value="slide">Slide</option></select></div></div><div class="group checks"><h3>KUNDENFUNKTIONEN</h3><label><input id="fav" type="checkbox" checked> Favoriten</label><label><input id="download" type="checkbox" checked> Download</label><label><input id="share" type="checkbox" checked> Teilen</label><label><input id="show" type="checkbox" checked> Diashow</label></div><div class="buttons"><button class="btn dark" onclick="save()">Speichern</button><button class="btn" onclick="reset()">Zurücksetzen</button></div></aside><main class="preview"><p class="muted">LIVE-VORSCHAU · Julia &amp; Kosta</p><section id="preview"><div class="hero"><div class="hero-content"><p>8. AUGUST 2026</p><h1 id="title">JULIA &amp; KOSTA</h1><span>FOTOS ANZEIGEN</span></div></div><div class="gallery" id="grid"><div class="photo"></div><div class="photo"></div><div class="photo"></div><div class="photo"></div><div class="photo"></div><div class="photo"></div><div class="photo"></div><div class="photo"></div></div></section></main></div><script>const $=id=>document.getElementById(id);function apply(){let p=$('preview'),h=p.querySelector('.hero'),t=$('title'),g=$('grid');t.style.fontFamily=$('font').value;t.style.fontSize=$('size').value+'px';h.style.height=$('heroHeight').value+'px';h.style.setProperty('--ov',$('overlay').value/100);h.style.setProperty('background','linear-gradient(135deg,#a9927b,#554a42)');g.style.gridTemplateColumns=`repeat(${$('cols').value},1fr)`;g.style.gap=$('gap').value+'px';p.className=$('anim').value}function preset(x){if(x==='editorial'){font.value='Georgia';size.value=64;cols.value=4;gap.value=8;anim.value='fadeup'}if(x==='luxury'){font.value='Georgia';size.value=72;cols.value=3;gap.value=14;anim.value='zoom'}if(x==='minimal'){font.value='Arial';size.value=52;cols.value=4;gap.value=4;anim.value='none'}if(x==='wedding'){font.value='cursive';size.value=60;cols.value=3;gap.value=10;anim.value='fadeup'}apply()}function save(){localStorage.setItem('vikfilmDesign',JSON.stringify({font:font.value,size:size.value,cols:cols.value,gap:gap.value,anim:anim.value,overlay:overlay.value,heroHeight:heroHeight.value,fav:fav.checked,download:download.checked,share:share.checked,show:show.checked}));alert('Design gespeichert.')}function reset(){localStorage.removeItem('vikfilmDesign');location.reload()}apply()</script></body></html>
