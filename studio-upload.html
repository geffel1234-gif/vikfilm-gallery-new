<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VikFilm Studio – Foto Upload</title>
<link rel="stylesheet" href="studio-upload.css">
</head>
<body>
<div class="upload-studio">
<header class="upload-head">
<div><div class="eyebrow">VIKFILM STUDIO · MEDIEN</div><h1>Fotos hinzufügen</h1><p id="galleryLabel">Kundengalerie</p></div>
<a class="secondary" href="admin.html">← Zur Verwaltung</a>
</header>
<section class="upload-panel">
<div id="dropzone" class="dropzone"><div class="upload-icon">↑</div><h2>Fotos hierher ziehen</h2><p>oder vom Computer auswählen</p><input id="picker" type="file" accept="image/jpeg,image/png,image/webp" multiple><button class="primary" id="choose">Dateien auswählen</button><small>JPG, PNG oder WEBP · mehrere Dateien gleichzeitig</small></div>
<div class="upload-toolbar"><div><strong id="count">0 Fotos ausgewählt</strong><span id="size"> · 0 MB</span></div><div><button class="secondary" id="clear">Auswahl leeren</button><button class="primary" id="save">↑ Fotos zur Galerie hinzufügen</button></div></div>
<div id="preview" class="preview"></div><div id="empty" class="empty"><div>＋</div><h3>Noch keine Fotos ausgewählt</h3><p>Ziehe deine Bilder oben hinein oder wähle sie aus.</p></div>
</section><div id="toast" class="toast"></div></div>
<script>
const KEY='vikfilmAdminGalleries';
const picker=document.querySelector('#picker'),drop=document.querySelector('#dropzone'),preview=document.querySelector('#preview'),count=document.querySelector('#count'),size=document.querySelector('#size'),empty=document.querySelector('#empty'),files=[];
let galleries=JSON.parse(localStorage.getItem(KEY)||'null')||[];
const params=new URLSearchParams(location.search);
const requested=params.get('gallery');
let gallery=galleries.find(g=>g.slug===requested||g.id===requested)||galleries[0]||null;
if(gallery) document.querySelector('#galleryLabel').textContent=gallery.name+' · Hochzeitsgalerie';
function persist(){localStorage.setItem(KEY,JSON.stringify(galleries));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function bytes(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';}
function render(){preview.innerHTML='';empty.hidden=files.length>0;let total=0;files.forEach((f,i)=>{total+=f.size;const u=URL.createObjectURL(f);const el=document.createElement('article');el.className='upload-card';el.innerHTML=`<div class="thumb"><img src="${u}"><span>${i+1}</span></div><div class="upload-info"><b>${esc(f.name)}</b><small>${bytes(f.size)}</small></div><div class="upload-actions"><button title="Nach oben" ${i?'':'disabled'} onclick="move(${i},-1)">↑</button><button title="Nach unten" ${i<files.length-1?'':'disabled'} onclick="move(${i},1)">↓</button><button title="Entfernen" onclick="removeFile(${i})">×</button></div>`;preview.appendChild(el);});count.textContent=files.length+' Foto'+(files.length===1?'':'s')+' ausgewählt';size.textContent=' · '+bytes(total);}
function add(list){[...list].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type)).forEach(f=>files.push(f));render();}
function removeFile(i){files.splice(i,1);render();}
function move(i,d){const j=i+d;if(j<0||j>=files.length)return;[files[i],files[j]]=[files[j],files[i]];render();}
picker.onchange=e=>add(e.target.files);
document.querySelector('#choose').onclick=()=>picker.click();
['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag');}));
['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag');}));
drop.addEventListener('drop',e=>add(e.dataTransfer.files));
document.querySelector('#clear').onclick=()=>{files.length=0;render();};
document.querySelector('#save').onclick=async()=>{
if(!files.length){toast('Bitte zuerst Fotos auswählen');return;}
if(!gallery){toast('Keine Galerie gefunden. Öffne den Upload aus einer Galerie heraus.');return;}
const btn=document.querySelector('#save');btn.disabled=true;const urls=[];
try{for(let i=0;i<files.length;i++){btn.textContent=`Upload ${i+1} / ${files.length}…`;urls.push(await fileToDataURL(files[i]));}
 gallery.images=(gallery.images||[]).concat(urls);gallery.photos=gallery.images.length;gallery.activity=gallery.activity||[];gallery.activity.unshift(`${files.length} Foto(s) hinzugefügt`);persist();
 toast(files.length+' Fotos wurden zur Galerie „'+gallery.name+'“ hinzugefügt');files.length=0;render();
}catch(e){toast('Upload fehlgeschlagen');}
btn.disabled=false;btn.textContent='↑ Fotos zur Galerie hinzufügen';
};
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500);}
render();
</script>
</body>
</html>
