<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VikFilm — Gallery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f6f3;color:#171716;font-family:'DM Sans',sans-serif}.hero{height:94vh;min-height:620px;position:relative;display:grid;place-items:center;color:#fff;overflow:hidden;background:#181818}.heroBg{position:absolute;inset:-4%;background:radial-gradient(circle at 70% 32%,#d9d1c4,#817b74 28%,#393735 62%,#111);transform:scale(1.03);transition:transform 1.4s ease}.hero:hover .heroBg{transform:scale(1.06)}.heroBg:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0006,transparent 28%,transparent 55%,#000b)}.top{position:absolute;left:0;right:0;top:0;padding:30px 38px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.3em;z-index:2}.heroContent{text-align:center;position:relative;z-index:2;padding-top:50px}.date{font:italic 18px 'Playfair Display';opacity:.9}.hero h1{font-size:clamp(48px,7vw,112px);letter-spacing:-.045em;line-height:.9;margin:16px 0 34px}.enter{border:1px solid #fff7;background:#fff1;color:#fff;border-radius:99px;padding:13px 21px;font-size:9px;letter-spacing:.2em;cursor:pointer;backdrop-filter:blur(12px);transition:.25s}.enter:hover{background:#fff;color:#111}.toolbar{height:82px;position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(18px);border-bottom:1px solid #e5e1db;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,46px)}.title small{display:block;color:#aaa;font-size:8px;letter-spacing:.2em;margin-top:5px}.actions{display:flex;gap:20px}.act{border:0;background:none;color:#777;cursor:pointer;font-size:8px;letter-spacing:.12em;display:flex;gap:7px;align-items:center}.act b{font-size:19px;font-weight:400}.act:hover{color:#111}.grid{max-width:1700px;margin:auto;padding:22px clamp(8px,2vw,30px) 100px;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:90px;gap:7px}.tile{position:relative;overflow:hidden;background:#ddd;cursor:pointer}.tile:nth-child(1){grid-column:span 7;grid-row:span 7}.tile:nth-child(2){grid-column:span 5;grid-row:span 7}.tile:nth-child(3){grid-column:span 5;grid-row:span 5}.tile:nth-child(4){grid-column:span 7;grid-row:span 5}.tile:nth-child(n+5){grid-column:span 4;grid-row:span 4}.pic{width:100%;height:100%;border:0;padding:0;background-size:cover;background-position:center;transition:transform .7s cubic-bezier(.2,.7,.2,1),filter .4s}.tile:hover .pic{transform:scale(1.04);filter:brightness(.86)}.tile:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#0004);opacity:0;transition:.3s;pointer-events:none}.tile:hover:after{opacity:1}.tools{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;z-index:3;opacity:0;transform:translateY(8px);transition:.25s}.tile:hover .tools{opacity:1;transform:none}.tools div{display:flex;gap:6px}.tools button{width:40px;height:40px;border:0;border-radius:50%;background:#fffe;color:#555;box-shadow:0 5px 18px #0003;cursor:pointer;font-size:18px}.tools button:hover{color:#111;transform:scale(1.06)}.lightbox{position:fixed;inset:0;z-index:100;background:#0b0b0bf2;backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center}.lightbox.show{display:flex}.viewer{width:min(90vw,1200px);height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.viewpic{width:100%;height:calc(100% - 55px);background-size:contain;background-repeat:no-repeat;background-position:center}.viewbar{display:flex;gap:5px;background:#fff;border-radius:99px;padding:5px}.viewbar button{border:0;background:none;border-radius:99px;padding:10px 15px;color:#666;font-size:9px;letter-spacing:.08em;cursor:pointer}.viewbar button:hover{background:#efede9;color:#111}.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #fff3;background:#fff1;color:#fff;font-size:28px;cursor:pointer}.prev{left:25px}.next{right:25px}.x{position:absolute;right:25px;top:25px;width:46px;height:46px;border-radius:50%;border:1px solid #fff3;background:#fff1;color:#fff;font-size:28px;cursor:pointer}.count{position:absolute;bottom:22px;color:#fff9;font-size:9px;letter-spacing:.2em}.fav{color:#111!important}footer{text-align:center;padding:70px 20px;border-top:1px solid #e3dfd9;color:#999;font-size:10px}footer strong{display:block;color:#222;letter-spacing:.34em;margin-bottom:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(6,1fr);grid-auto-rows:100px}.tile:nth-child(1),.tile:nth-child(2){grid-column:span 6}.tile:nth-child(3),.tile:nth-child(4){grid-column:span 3}.tile:nth-child(n+5){grid-column:span 2}}@media(max-width:600px){.hero{height:78vh;min-height:520px}.top{padding:22px 18px}.toolbar{height:66px;padding:0 12px}.actions{gap:13px}.act span{display:none}.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;padding:6px 5px 55px;gap:5px}.tile:nth-child(1),.tile:nth-child(2){grid-column:span 2;grid-row:span 3}.tile:nth-child(n+3){grid-column:span 1;grid-row:span 2}.tools{opacity:1;transform:none}.tools button{width:34px;height:34px}.viewer{width:94vw;height:82vh}.nav{width:40px;height:40px}.prev{left:10px}.next{right:10px}.x{right:12px;top:12px}} </style></head><body><header class="hero"><div class="heroBg" id="heroBg"></div><div class="top"><span>VIKFILM</span><span>KUNDENGALERIE</span></div><div class="heroContent"><div class="date" id="date">8. August 2026</div><h1 id="name">JULIA &amp; KOSTA</h1><button class="enter" onclick="document.getElementById('gallery').scrollIntoView({behavior:'smooth'})">FOTOS ANZEIGEN</button></div></header><section class="toolbar"><div class="title"><strong id="title">JULIA &amp; KOSTA</strong><small id="countFav">0 FAVORITEN</small></div><div class="actions"><button class="act" onclick="filterFavorites()"><b>♡</b><span>FAVORITEN</span></button><button class="act" onclick="downloadAll()"><b>↓</b><span>DOWNLOAD</span></button><button class="act" onclick="share()"><b>↗</b><span>TEILEN</span></button><button class="act" onclick="slideshow()"><b>▷</b><span>DIASHOW</span></button></div></section><main class="grid" id="gallery"></main><div class="lightbox" id="lightbox"><button class="x" onclick="closeViewer()">×</button><button class="nav prev" onclick="move(-1)">‹</button><div class="viewer"><div class="viewpic" id="viewpic"></div><div class="viewbar"><button onclick="favCurrent()">♡ FAVORIT</button><button onclick="downloadCurrent()">↓ DOWNLOAD</button><button onclick="share()">↗ TEILEN</button></div></div><button class="nav next" onclick="move(1)">›</button><div class="count" id="viewerCount"></div></div><footer><strong>VIKFILM</strong>Photography &amp; Videography</footer><script>const key='vikfilmAdminGalleries';const data=JSON.parse(localStorage.getItem(key)||'null')||[];const p=new URLSearchParams(location.search);const wanted=p.get('gallery');const g=data.find(x=>x.slug===wanted||x.id===wanted)||data[0]||{};let imgs=g.images||[];if(!imgs.length)imgs=['linear-gradient(140deg,#a96736,#e3c7a1 48%,#76503a)','linear-gradient(155deg,#263e26,#9ab16b 45%,#d9d3ba)','linear-gradient(135deg,#3c211c,#c6784c 45%,#e4c9a8)','linear-gradient(140deg,#191919,#76594d 50%,#ba806d)','linear-gradient(150deg,#7e4b2c,#d3a37b 45%,#5a493c)','linear-gradient(145deg,#d8d0c0,#66805d 45%,#26382a)'];let fav=new Set(JSON.parse(localStorage.getItem('vikfilmFavorites')||'[]'));let current=0,timer=null;const name=(g.name||'Julia & Kosta').toUpperCase();document.getElementById('name').textContent=name;document.getElementById('title').textContent=name;if(g.date)document.getElementById('date').textContent=new Date(g.date+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});function bg(src,el){if(src.startsWith('data:image')||src.startsWith('http'))el.style.backgroundImage=`url(${src})`;else el.style.background=src}function render(){const grid=document.getElementById('gallery');grid.innerHTML='';imgs.forEach((src,i)=>{const tile=document.createElement('article');tile.className='tile';const pic=document.createElement('button');pic.className='pic';bg(src,pic);pic.onclick=()=>open(i);const tools=document.createElement('div');tools.className='tools';const left=document.createElement('div');const b1=document.createElement('button');b1.textContent=fav.has(i)?'♥':'♡';b1.onclick=e=>{e.stopPropagation();toggle(i)};left.append(b1);const right=document.createElement('div');const b2=document.createElement('button');b2.textContent='↓';b2.onclick=e=>{e.stopPropagation();download(i)};const b3=document.createElement('button');b3.textContent='↗';b3.onclick=e=>{e.stopPropagation();sharePhoto(i)};right.append(b2,b3);tools.append(left,right);tile.append(pic,tools);grid.append(tile)});document.getElementById('countFav').textContent=fav.size+' FAVORITEN'}function toggle(i){fav.has(i)?fav.delete(i):fav.add(i);localStorage.setItem('vikfilmFavorites',JSON.stringify([...fav]));render()}function filterFavorites(){document.querySelectorAll('.tile').forEach((x,i)=>x.style.display=fav.size&&!fav.has(i)?'none':'block')}function open(i){current=i;show();document.getElementById('lightbox').classList.add('show')}function show(){const v=document.getElementById('viewpic');v.style.background='';v.style.backgroundImage='';bg(imgs[current],v);document.getElementById('viewerCount').textContent=(current+1)+' / '+imgs.length}function closeViewer(){clearInterval(timer);document.getElementById('lightbox').classList.remove('show')}function move(d){current=(current+d+imgs.length)%imgs.length;show()}function favCurrent(){toggle(current);show()}function slideshow(){open(0);clearInterval(timer);timer=setInterval(()=>move(1),3500)}function download(i){alert('Download wird mit den echten Bilddateien verbunden.')}function downloadCurrent(){download(current)}function downloadAll(){alert(fav.size?fav.size+' Favoriten zum Download ausgewählt.':'Wählt zuerst Favoriten aus.')}async function share(){try{await navigator.share({title:name,text:'VikFilm Galerie',url:location.href})}catch(e){navigator.clipboard?.writeText(location.href);alert('Galerie-Link kopiert.')}}async function sharePhoto(i){try{await navigator.share({title:name+' – Foto '+(i+1),url:location.href+'#foto-'+(i+1)})}catch(e){navigator.clipboard?.writeText(location.href+'#foto-'+(i+1))}}document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();</script></body></html>
