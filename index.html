<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia &amp; Kosta – VikFilm Galerie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-image" aria-hidden="true"></div>
    <div class="hero-overlay"></div>
    <nav class="topbar"><div class="brand">VIKFILM</div><div class="gallery-label">KUNDENGALERIE</div></nav>
    <div class="hero-content">
      <p class="date">8. August 2026</p>
      <h1>JULIA &amp; KOSTA</h1>
      <button class="hero-link" onclick="scrollToGallery()">FOTOS ANZEIGEN</button>
    </div>
  </header>

  <section class="gallery-toolbar">
    <div class="gallery-title"><strong>JULIA &amp; KOSTA</strong><span>VIKFILM</span></div>
    <div class="actions">
      <button class="action" id="favoriteButton" onclick="toggleFavorites()"><span class="icon">♡</span><span>FAVORITEN</span></button>
      <button class="action" onclick="downloadGallery()"><span class="icon">↓</span><span>DOWNLOAD</span></button>
      <button class="action" onclick="shareGallery()"><span class="icon">↗</span><span>TEILEN</span></button>
      <button class="action" onclick="startSlideshow()"><span class="icon">▷</span><span>DIASHOW</span></button>
    </div>
  </section>

  <main id="gallery" class="gallery">
    <button class="photo photo-1" onclick="openPhoto(0)"></button>
    <button class="photo photo-2" onclick="openPhoto(1)"></button>
    <button class="photo photo-3" onclick="openPhoto(2)"></button>
    <button class="photo photo-4" onclick="openPhoto(3)"></button>
    <button class="photo photo-5" onclick="openPhoto(4)"></button>
    <button class="photo photo-6" onclick="openPhoto(5)"></button>
  </main>

  <div class="lightbox" id="lightbox" onclick="closePhoto(event)">
    <button class="close" onclick="closePhoto()">×</button>
    <button class="prev" onclick="changePhoto(-1); event.stopPropagation()">‹</button>
    <div class="lightbox-photo" id="lightboxPhoto"></div>
    <button class="next" onclick="changePhoto(1); event.stopPropagation()">›</button>
    <div class="counter" id="counter"></div>
  </div>

  <footer><div class="brand">VIKFILM</div><span>Photography &amp; Videography</span></footer>

  <script>
    let currentPhoto = 0;
    let favoritesOn = false;
    const photos = ['photo-1','photo-2','photo-3','photo-4','photo-5','photo-6'];
    function scrollToGallery(){document.getElementById('gallery').scrollIntoView({behavior:'smooth'});}
    function toggleFavorites(){favoritesOn=!favoritesOn;const b=document.getElementById('favoriteButton');b.classList.toggle('active',favoritesOn);b.querySelector('.icon').textContent=favoritesOn?'♥':'♡';document.querySelectorAll('.photo').forEach((p,i)=>p.classList.toggle('favorite',favoritesOn&&i%2===0));}
    async function shareGallery(){const data={title:'Julia & Kosta – VikFilm',text:'Unsere Galerie bei VikFilm',url:window.location.href};if(navigator.share){try{await navigator.share(data);}catch(e){}}else{await navigator.clipboard?.writeText(window.location.href);alert('Galerie-Link wurde kopiert.');}}
    function downloadGallery(){alert('Hier wird später der Download eurer ausgewählten Bilder eingebaut.');}
    function startSlideshow(){currentPhoto=0;showPhoto();document.getElementById('lightbox').classList.add('show');}
    function openPhoto(i){currentPhoto=i;showPhoto();document.getElementById('lightbox').classList.add('show');}
    function closePhoto(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('lightbox').classList.remove('show');}
    function changePhoto(d){currentPhoto=(currentPhoto+d+photos.length)%photos.length;showPhoto();}
    function showPhoto(){const b=document.getElementById('lightboxPhoto');b.className='lightbox-photo '+photos[currentPhoto];document.getElementById('counter').textContent=`${currentPhoto+1} / ${photos.length}`;}
    document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')changePhoto(-1);if(e.key==='ArrowRight')changePhoto(1);});
  </script>
</body>
</html>
