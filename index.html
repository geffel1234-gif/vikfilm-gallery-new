<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VikFilm Galerie</title><link rel="stylesheet" href="style.css"></head><body><header class="hero"><div class="hero-image"></div><div class="hero-overlay"></div><nav class="topbar"><div class="brand">VIKFILM</div><div>KUNDENGALERIE</div></nav><div class="hero-content"><p class="date" id="date"></p><h1 id="title">VIKFILM</h1><button class="hero-link" onclick="scrollToGallery()">FOTOS ANZEIGEN</button></div></header><section class="gallery-toolbar"><div class="gallery-title"><strong id="toolbarTitle"></strong><span id="favoriteCount">0 FAVORITEN</span></div><div class="actions"><button class="action" id="favBtn" onclick="toggleFavoritesView()"><span class="icon">♡</span><span>FAVORITEN</span></button><button class="action" id="downloadBtn" onclick="downloadFavorites()"><span class="icon">↓</span><span>DOWNLOAD</span></button><button class="action" onclick="shareGallery()"><span class="icon">↗</span><span>TEILEN</span></button><button class="action" id="slideBtn" onclick="toggleSlideshow()"><span class="icon">▷</span><span>DIASHOW</span></button></div></section><main id="gallery" class="gallery"></main><div class="lightbox" id="lightbox"><button class="close" onclick="closeLightbox()">×</button><button class="prev" onclick="change(-1)">‹</button><div class="lightbox-content"><div id="lightboxPhoto" class="lightbox-photo"></div><div class="lightbox-controls"><button id="lbFav" onclick="toggleFavorite(current)">♡ FAVORIT</button><button onclick="downloadCurrent()">↓ DOWNLOAD</button><button onclick="sharePhoto(current)">↗ TEILEN</button></div></div><button class="next" onclick="change(1)">›</button><div id="counter" class="counter"></div></div><footer><div class="brand">VIKFILM</div><span>Photography &amp; Videography</span></footer><script>
const KEY='vikfilmStudioGalleries',MEDIA='vikfilmMediaDB';let db=JSON.parse(localStorage.getItem(KEY)||'null')||[],gallery=null,media=[],favorites=new Set(JSON.parse(localStorage.getItem('vikfilmFavorites')||'[]')),current=0,slideTimer=null,favoriteOnly=false;const requested=new URLSearchParams(location.search).get('gallery');gallery=db.find(g=>g.slug===requested||g.id===requested)||db[0]||null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function favSave(){localStorage.setItem('vikfilmFavorites',JSON.stringify([...favorites]));updateUI()}function scrollToGallery(){document.getElementById('gallery').scrollIntoView({behavior:'smooth'})}function toggleFavorite(i){if(favorites.has(i))favorites.delete(i);else favorites.add(i);favSave()}function toggleFavoritesView(){favoriteOnly=!favoriteOnly;document.getElementById('favBtn').classList.toggle('active',favoriteOnly);updateUI()}function updateUI(){document.getElementById('favoriteCount').textContent=favorites.size+' FAVORITEN';document.querySelectorAll('.photo-wrap').forEach((w,i)=>w.classList.toggle('hidden-favorite',favoriteOnly&&!favorites.has(i)));document.querySelectorAll('.photo-actions button[data-fav]').forEach(b=>b.textContent=favorites.has(+b.dataset.fav)?'♥':'♡');document.getElementById('lbFav').textContent=favorites.has(current)?'♥ FAVORIT':'♡ FAVORIT'}async function shareGallery(){try{await navigator.share({title:gallery?.name||'VikFilm Galerie',text:'Unsere Galerie bei VikFilm',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);alert('Galerie-Link kopiert.')}catch(e){}}}async function sharePhoto(i){let u=location.href.split('#')[0]+'#foto-'+(i+1);try{await navigator.share({title:'VikFilm Foto',url:u})}catch(e){navigator.clipboard?.writeText(u)}}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(MEDIA,1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function loadMedia(){if(!gallery)return;let d=await openDB();media=await new Promise((res,rej)=>{let r=d.transaction('media').objectStore('media').getAll();r.onsuccess=()=>res(r.result.filter(x=>x.galleryId===gallery.id));r.onerror=()=>rej(r.error)});render()}
async function render(){if(!gallery)return;document.title=(gallery.name||'VikFilm Galerie')+' – VikFilm';document.getElementById('title').textContent=(gallery.name||'VIKFILM').toUpperCase();document.getElementById('toolbarTitle').textContent=(gallery.name||'VIKFILM').toUpperCase();document.getElementById('date').textContent=gallery.date?new Date(gallery.date+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):'';if(gallery.status==='offline'){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Arial;text-align:center"><div><h1>Galerie nicht verfügbar</h1><p>Diese Galerie ist momentan offline.</p></div></main>';return}let src=[];for(const m of media)src.push({url:URL.createObjectURL(m.blob),name:m.name});if(!src.length)src=[1,2,3,4,5,6].map(n=>({cls:'photo-'+n,name:'Beispielfoto '+n}));gallery._sources=src;const el=document.getElementById('gallery');el.innerHTML='';src.forEach((s,i)=>{const w=document.createElement('div');w.className='photo-wrap';const p=document.createElement('button');p.className='photo '+(s.cls||'');if(s.url)p.style.backgroundImage=`url(${s.url})`;p.onclick=()=>openPhoto(i);const a=document.createElement('div');a.className='photo-actions';a.innerHTML=`<button data-fav="${i}">♡</button><button>↓</button><button>↗</button>`;a.children[0].onclick=e=>{e.stopPropagation();toggleFavorite(i)};a.children[1].onclick=e=>{e.stopPropagation();downloadIndex(i)};a.children[2].onclick=e=>{e.stopPropagation();sharePhoto(i)};w.append(p,a);el.appendChild(w)});applyDesign();updateUI();if(gallery.allowFavorites===false)document.getElementById('favBtn').style.display='none';if(gallery.allowDownloads===false)document.getElementById('downloadBtn').style.display='none'}
function applyDesign(){const d=gallery.design||{};document.documentElement.style.setProperty('--hero-height',(d.hero||78)+'vh');document.documentElement.style.setProperty('--grid-gap',(d.gap??4)+'px');const f={'Modern Sans':'Arial,sans-serif','Elegant Serif':'Playfair Display,Georgia,serif','Classic':'Georgia,serif','Romantic Script':'cursive'};document.documentElement.style.setProperty('--gallery-font',f[d.font]||f['Elegant Serif']);document.documentElement.dataset.preset=d.preset||'Editorial'}function openPhoto(i){current=i;showLightbox();document.getElementById('lightbox').classList.add('show')}function showLightbox(){const s=gallery._sources[current],b=document.getElementById('lightboxPhoto');b.className='lightbox-photo '+(s.cls||'');b.style.backgroundImage=s.url?`url(${s.url})`:'';document.getElementById('counter').textContent=(current+1)+' / '+gallery._sources.length;updateUI()}function closeLightbox(){document.getElementById('lightbox').classList.remove('show');stopSlideshow()}function change(n){current=(current+n+gallery._sources.length)%gallery._sources.length;showLightbox()}function toggleSlideshow(){if(slideTimer){stopSlideshow();return}document.getElementById('lightbox').classList.add('show');current=0;showLightbox();slideTimer=setInterval(()=>change(1),3500);document.getElementById('slideBtn').classList.add('active')}function stopSlideshow(){clearInterval(slideTimer);slideTimer=null;document.getElementById('slideBtn')?.classList.remove('active')}async function downloadIndex(i){if(gallery.allowDownloads===false)return;const s=gallery._sources[i];if(!s?.url){alert('Beispielbild – noch keine echte Datei vorhanden.');return}const a=document.createElement('a');a.href=s.url;a.download=s.name||'VikFilm-Foto';a.click();gallery.downloads=(gallery.downloads||0)+1;save()}function downloadCurrent(){downloadIndex(current)}async function downloadFavorites(){if(!favorites.size){alert('Wählt zuerst eure Lieblingsbilder aus.');return}for(const i of favorites)await downloadIndex(i)}document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});loadMedia();
</script></body></html>
