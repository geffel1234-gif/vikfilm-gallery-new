<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Julia &amp; Kosta – VikFilm Galerie</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="hero-image" aria-hidden="true"></div><div class="hero-overlay"></div><nav class="topbar"><div class="brand">VIKFILM</div><div class="gallery-label">KUNDENGALERIE</div></nav><div class="hero-content"><p class="date">8. August 2026</p><h1>JULIA &amp; KOSTA</h1><button class="hero-link" onclick="scrollToGallery()">FOTOS ANZEIGEN</button></div></header>
<section class="gallery-toolbar"><div class="gallery-title"><strong id="galleryTitle">JULIA &amp; KOSTA</strong><span id="favoriteCount">0 FAVORITEN</span></div><div class="actions"><button class="action" id="favoriteButton" onclick="showFavorites()"><span class="icon">♡</span><span>FAVORITEN</span></button><button class="action" onclick="downloadGallery()"><span class="icon">↓</span><span>DOWNLOAD</span></button><button class="action" onclick="shareGallery()"><span class="icon">↗</span><span>TEILEN</span></button><button class="action" id="slideshowButton" onclick="startSlideshow()"><span class="icon">▷</span><span>DIASHOW</span></button></div></section>
<main id="gallery" class="gallery"></main>
<div class="lightbox" id="lightbox" onclick="closePhoto(event)"><button class="close" onclick="closePhoto();event.stopPropagation()">×</button><button class="prev" onclick="changePhoto(-1);event.stopPropagation()">‹</button><div class="lightbox-content" onclick="event.stopPropagation()"><div class="lightbox-photo" id="lightboxPhoto"></div><div class="lightbox-controls"><button id="lightboxFavorite" onclick="toggleCurrentFavorite()">♡ FAVORIT</button><button onclick="downloadCurrent()">↓ DOWNLOAD</button><button onclick="shareGallery()">↗ TEILEN</button></div></div><button class="next" onclick="changePhoto(1);event.stopPropagation()">›</button><div class="counter" id="counter"></div></div>
<footer><div class="brand">VIKFILM</div><span>Photography &amp; Videography</span></footer>
<script>
const KEY='vikfilmAdminGalleries';
let currentPhoto=0,slideshowTimer=null,slideshowRunning=false;
const params=new URLSearchParams(location.search);
const requested=params.get('gallery');
const galleries=JSON.parse(localStorage.getItem(KEY)||'null')||[];
const gallery=galleries.find(g=>g.slug===requested||g.id===requested)||galleries[0]||null;
let photoSources=[];
let favorites=new Set(JSON.parse(localStorage.getItem('vikfilmFavorites')||'[]'));

function scrollToGallery(){document.getElementById('gallery').scrollIntoView({behavior:'smooth'});}
function saveFavorites(){localStorage.setItem('vikfilmFavorites',JSON.stringify([...favorites]));updateFavoriteUI();}
function updateFavoriteUI(){document.querySelectorAll('.photo-heart').forEach((button,index)=>{const active=favorites.has(index);button.textContent=active?'♥':'♡';button.classList.toggle('selected',active);});document.getElementById('favoriteCount').textContent=`${favorites.size} FAVORITEN`;updateLightboxFavorite();updatePhotoActionUI();}
function toggleFavorite(index,event){if(event)event.stopPropagation();if(favorites.has(index))favorites.delete(index);else favorites.add(index);saveFavorites();}
function toggleCurrentFavorite(){toggleFavorite(currentPhoto);}
function updateLightboxFavorite(){const button=document.getElementById('lightboxFavorite');if(!button)return;const active=favorites.has(currentPhoto);button.textContent=active?'♥ FAVORIT':'♡ FAVORIT';button.classList.toggle('selected',active);}
function showFavorites(){document.querySelectorAll('.photo-wrap').forEach((wrap,index)=>wrap.classList.toggle('hidden-favorite',favorites.size>0&&!favorites.has(index)));const button=document.getElementById('favoriteButton');button.classList.toggle('active',favorites.size>0);button.querySelector('.icon').textContent=favorites.size>0?'♥':'♡';if(favorites.size===0)document.querySelectorAll('.photo-wrap').forEach(w=>w.classList.remove('hidden-favorite'));}
async function shareGallery(){const data={title:(gallery?.name||'VikFilm Galerie'),text:'Unsere Galerie bei VikFilm',url:window.location.href};if(navigator.share){try{await navigator.share(data);}catch(e){}}else{try{await navigator.clipboard.writeText(window.location.href);alert('Galerie-Link wurde kopiert.');}catch(e){alert('Galerie-Link: '+window.location.href);}}}
function sharePhoto(index){const url=window.location.href.split('#')[0]+'#foto-'+(index+1);if(navigator.share){navigator.share({title:(gallery?.name||'VikFilm')+' – Foto '+(index+1),text:'Foto aus unserer VikFilm Galerie',url}).catch(()=>{});}else{navigator.clipboard?.writeText(url).then(()=>alert('Foto-Link wurde kopiert.')).catch(()=>alert('Foto-Link: '+url));}}
function downloadGallery(){if(favorites.size===0){alert('Wählt zuerst eure Lieblingsbilder mit dem Herz aus.');return;}alert(`${favorites.size} Favoriten ausgewählt. Der echte Foto-Download kommt als nächster Schritt.`);}
function downloadCurrent(){alert(`Download für Foto ${currentPhoto+1} wird als nächster Schritt mit echten Bilddateien verbunden.`);}
function downloadPhoto(index){alert(`Download für Foto ${index+1} wird als nächster Schritt mit der echten Bilddatei verbunden.`);}
function addPhotoActions(){document.querySelectorAll('.photo-wrap').forEach((wrap,index)=>{if(wrap.querySelector('.photo-actions'))return;const actions=document.createElement('div');actions.className='photo-actions';actions.innerHTML=`<button type="button" aria-label="Foto ${index+1} favorisieren">♡</button><button type="button" aria-label="Foto ${index+1} herunterladen">↓</button><button type="button" aria-label="Foto ${index+1} teilen">↗</button>`;const [fav,download,share]=actions.children;fav.addEventListener('click',e=>{e.stopPropagation();toggleFavorite(index,e);});download.addEventListener('click',e=>{e.stopPropagation();downloadPhoto(index);});share.addEventListener('click',e=>{e.stopPropagation();sharePhoto(index);});wrap.appendChild(actions);});updatePhotoActionUI();}
function updatePhotoActionUI(){document.querySelectorAll('.photo-wrap').forEach((wrap,index)=>{const button=wrap.querySelector('.photo-actions button');if(button){button.textContent=favorites.has(index)?'♥':'♡';button.classList.toggle('selected',favorites.has(index));}});}
function startSlideshow(){if(!photoSources.length)return;clearInterval(slideshowTimer);slideshowRunning=true;currentPhoto=0;showPhoto();document.getElementById('lightbox').classList.add('show');document.getElementById('slideshowButton').classList.add('active');slideshowTimer=setInterval(()=>changePhoto(1),3500);}
function stopSlideshow(){clearInterval(slideshowTimer);slideshowTimer=null;slideshowRunning=false;document.getElementById('slideshowButton')?.classList.remove('active');}
function openPhoto(i){stopSlideshow();currentPhoto=i;showPhoto();document.getElementById('lightbox').classList.add('show');}
function closePhoto(e){if(e&&e.target!==e.currentTarget)return;stopSlideshow();document.getElementById('lightbox').classList.remove('show');}
function changePhoto(d){if(!photoSources.length)return;currentPhoto=(currentPhoto+d+photoSources.length)%photoSources.length;showPhoto();}
function showPhoto(){const b=document.getElementById('lightboxPhoto');b.className='lightbox-photo';if(photoSources[currentPhoto]?.startsWith('data:image')){b.style.backgroundImage=`url(${photoSources[currentPhoto]})`;b.style.backgroundSize='contain';b.style.backgroundPosition='center';b.style.backgroundRepeat='no-repeat';}else{b.style.backgroundImage='';b.classList.add(photoSources[currentPhoto]||'photo-1');}document.getElementById('counter').textContent=`${currentPhoto+1} / ${photoSources.length}`;updateLightboxFavorite();}
function buildGallery(){const el=document.getElementById('gallery');el.innerHTML='';if(gallery){document.title=(gallery.name||'VikFilm Galerie')+' – VikFilm Galerie';document.getElementById('galleryTitle').textContent=(gallery.name||'KUNDENGALERIE').toUpperCase();const title=document.querySelector('.hero-content h1');if(title)title.textContent=(gallery.name||'VIKFILM GALERIE').toUpperCase();const date=document.querySelector('.hero-content .date');if(date&&gallery.date){date.textContent=new Date(gallery.date+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});}photoSources=(gallery.images||[]);}
if(!photoSources.length)photoSources=['photo-1','photo-2','photo-3','photo-4','photo-5','photo-6'];
photoSources.forEach((src,index)=>{const wrap=document.createElement('div');wrap.className='photo-wrap';const button=document.createElement('button');button.className='photo';button.setAttribute('aria-label','Foto '+(index+1));button.onclick=()=>openPhoto(index);if(src.startsWith('data:image')){button.style.backgroundImage=`url(${src})`;button.style.backgroundSize='cover';button.style.backgroundPosition='center';}else{button.classList.add(src);}const heart=document.createElement('button');heart.className='photo-heart';heart.textContent='♡';heart.setAttribute('aria-label','Foto '+(index+1)+' favorisieren');heart.onclick=e=>toggleFavorite(index,e);wrap.append(button,heart);el.appendChild(wrap);});addPhotoActions();updateFavoriteUI();}
document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')changePhoto(-1);if(e.key==='ArrowRight')changePhoto(1);});
buildGallery();
</script>
</body>
</html>
