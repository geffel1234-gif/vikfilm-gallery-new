<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia &amp; Kosta – VikFilm Galerie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-image" aria-hidden="true"></div>
    <div class="hero-overlay"></div>
    <nav class="topbar"><div class="brand">VIKFILM</div><div class="gallery-label">KUNDENGALERIE</div></nav>
    <div class="hero-content">
      <p class="date">8. August 2026</p>
      <h1>JULIA &amp; KOSTA</h1>
      <button class="hero-link" onclick="scrollToGallery()">FOTOS ANZEIGEN</button>
    </div>
  </header>

  <section class="gallery-toolbar">
    <div class="gallery-title"><strong>JULIA &amp; KOSTA</strong><span id="favoriteCount">0 FAVORITEN</span></div>
    <div class="actions">
      <button class="action" id="favoriteButton" onclick="showFavorites()"><span class="icon">♡</span><span>FAVORITEN</span></button>
      <button class="action" onclick="downloadGallery()"><span class="icon">↓</span><span>DOWNLOAD</span></button>
      <button class="action" onclick="shareGallery()"><span class="icon">↗</span><span>TEILEN</span></button>
      <button class="action" onclick="startSlideshow()"><span class="icon">▷</span><span>DIASHOW</span></button>
    </div>
  </section>

  <main id="gallery" class="gallery">
    <div class="photo-wrap"><button class="photo photo-1" onclick="openPhoto(0)" aria-label="Foto 1"></button><button class="photo-heart" onclick="toggleFavorite(0,event)" aria-label="Foto 1 favorisieren">♡</button></div>
    <div class="photo-wrap"><button class="photo photo-2" onclick="openPhoto(1)" aria-label="Foto 2"></button><button class="photo-heart" onclick="toggleFavorite(1,event)" aria-label="Foto 2 favorisieren">♡</button></div>
    <div class="photo-wrap"><button class="photo photo-3" onclick="openPhoto(2)" aria-label="Foto 3"></button><button class="photo-heart" onclick="toggleFavorite(2,event)" aria-label="Foto 3 favorisieren">♡</button></div>
    <div class="photo-wrap"><button class="photo photo-4" onclick="openPhoto(3)" aria-label="Foto 4"></button><button class="photo-heart" onclick="toggleFavorite(3,event)" aria-label="Foto 4 favorisieren">♡</button></div>
    <div class="photo-wrap"><button class="photo photo-5" onclick="openPhoto(4)" aria-label="Foto 5"></button><button class="photo-heart" onclick="toggleFavorite(4,event)" aria-label="Foto 5 favorisieren">♡</button></div>
    <div class="photo-wrap"><button class="photo photo-6" onclick="openPhoto(5)" aria-label="Foto 6"></button><button class="photo-heart" onclick="toggleFavorite(5,event)" aria-label="Foto 6 favorisieren">♡</button></div>
  </main>

  <div class="lightbox" id="lightbox" onclick="closePhoto(event)">
    <button class="close" onclick="closePhoto();event.stopPropagation()">×</button>
    <button class="prev" onclick="changePhoto(-1);event.stopPropagation()">‹</button>
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <div class="lightbox-photo" id="lightboxPhoto"></div>
      <div class="lightbox-controls">
        <button id="lightboxFavorite" onclick="toggleCurrentFavorite()">♡ FAVORIT</button>
        <button onclick="downloadCurrent()">↓ DOWNLOAD</button>
        <button onclick="shareGallery()">↗ TEILEN</button>
      </div>
    </div>
    <button class="next" onclick="changePhoto(1);event.stopPropagation()">›</button>
    <div class="counter" id="counter"></div>
  </div>

  <footer><div class="brand">VIKFILM</div><span>Photography &amp; Videography</span></footer>

  <script>
    let currentPhoto = 0;
    let slideshowTimer = null;
    const photos = ['photo-1','photo-2','photo-3','photo-4','photo-5','photo-6'];
    let favorites = new Set(JSON.parse(localStorage.getItem('vikfilmFavorites') || '[]'));

    function scrollToGallery(){document.getElementById('gallery').scrollIntoView({behavior:'smooth'});}
    function saveFavorites(){localStorage.setItem('vikfilmFavorites',JSON.stringify([...favorites]));updateFavoriteUI();}
    function updateFavoriteUI(){
      document.querySelectorAll('.photo-heart').forEach((button,index)=>{const active=favorites.has(index);button.textContent=active?'♥':'♡';button.classList.toggle('selected',active);});
      document.getElementById('favoriteCount').textContent=`${favorites.size} FAVORITEN`;
      updateLightboxFavorite();
    }
    function toggleFavorite(index,event){if(event)event.stopPropagation();if(favorites.has(index))favorites.delete(index);else favorites.add(index);saveFavorites();}
    function toggleCurrentFavorite(){toggleFavorite(currentPhoto);}
    function updateLightboxFavorite(){const button=document.getElementById('lightboxFavorite');if(!button)return;const active=favorites.has(currentPhoto);button.textContent=active?'♥ FAVORIT':'♡ FAVORIT';button.classList.toggle('selected',active);}
    function showFavorites(){document.querySelectorAll('.photo-wrap').forEach((wrap,index)=>wrap.classList.toggle('hidden-favorite',favorites.size>0&&!favorites.has(index)));const button=document.getElementById('favoriteButton');button.classList.toggle('active',favorites.size>0);button.querySelector('.icon').textContent=favorites.size>0?'♥':'♡';if(favorites.size===0)document.querySelectorAll('.photo-wrap').forEach(w=>w.classList.remove('hidden-favorite'));}

    async function shareGallery(){
      const data={title:'Julia & Kosta – VikFilm',text:'Unsere Galerie bei VikFilm',url:window.location.href};
      if(navigator.share){try{await navigator.share(data);}catch(e){}}
      else{try{await navigator.clipboard.writeText(window.location.href);alert('Galerie-Link wurde kopiert.');}catch(e){alert('Galerie-Link: '+window.location.href);}}
    }
    function sharePhoto(index){
      const url=window.location.href.split('#')[0]+'#foto-'+(index+1);
      if(navigator.share){navigator.share({title:'Julia & Kosta – Foto '+(index+1),text:'Foto aus unserer VikFilm Galerie',url}).catch(()=>{});}
      else{navigator.clipboard?.writeText(url).then(()=>alert('Foto-Link wurde kopiert.')).catch(()=>alert('Foto-Link: '+url));}
    }
    function downloadGallery(){if(favorites.size===0){alert('Wählt zuerst eure Lieblingsbilder mit dem Herz aus.');return;}alert(`${favorites.size} Favoriten ausgewählt. Der echte Foto-Download kommt als nächster Schritt.`);}
    function downloadCurrent(){alert(`Download für Foto ${currentPhoto+1} wird als nächster Schritt mit echten Bilddateien verbunden.`);}
    function downloadPhoto(index){alert(`Download für Foto ${index+1} wird als nächster Schritt mit der echten Bilddatei verbunden.`);}

    function addPhotoActions(){
      document.querySelectorAll('.photo-wrap').forEach((wrap,index)=>{
        if(wrap.querySelector('.photo-actions'))return;
        const actions=document.createElement('div');
        actions.className='photo-actions';
        actions.innerHTML=`<button type="button" aria-label="Foto ${index+1} favorisieren">♡</button><button type="button" aria-label="Foto ${index+1} herunterladen">↓</button><button type="button" aria-label="Foto ${index+1} teilen">↗</button>`;
        const [fav,download,share]=actions.children;
        fav.addEventListener('click',e=>{e.stopPropagation();toggleFavorite(index,e);});
        download.addEventListener('click',e=>{e.stopPropagation();downloadPhoto(index);});
        share.addEventListener('click',e=>{e.stopPropagation();sharePhoto(index);});
        wrap.appendChild(actions);
      });
      updatePhotoActionUI();
    }
    function updatePhotoActionUI(){
      document.querySelectorAll('.photo-wrap').forEach((wrap,index)=>{
        const button=wrap.querySelector('.photo-actions button');
        if(button){button.textContent=favorites.has(index)?'♥':'♡';button.classList.toggle('selected',favorites.has(index));}
      });
    }

    function startSlideshow(){currentPhoto=0;showPhoto();document.getElementById('lightbox').classList.add('show');clearInterval(slideshowTimer);slideshowTimer=setInterval(()=>changePhoto(1),3500);}
    function openPhoto(i){clearInterval(slideshowTimer);currentPhoto=i;showPhoto();document.getElementById('lightbox').classList.add('show');}
    function closePhoto(e){if(e&&e.target!==e.currentTarget)return;clearInterval(slideshowTimer);document.getElementById('lightbox').classList.remove('show');}
    function changePhoto(d){currentPhoto=(currentPhoto+d+photos.length)%photos.length;showPhoto();}
    function showPhoto(){const b=document.getElementById('lightboxPhoto');b.className='lightbox-photo '+photos[currentPhoto];document.getElementById('counter').textContent=`${currentPhoto+1} / ${photos.length}`;updateLightboxFavorite();}
    document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')changePhoto(-1);if(e.key==='ArrowRight')changePhoto(1);});

    addPhotoActions();
    updateFavoriteUI();
  </script>
</body>
</html>
