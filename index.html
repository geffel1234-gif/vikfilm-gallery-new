<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VikFilm Galerie</title><link rel="stylesheet" href="style.css"><style>:root{--hero-height:78vh;--grid-gap:4px;--gallery-font:'Playfair Display',Georgia,serif}.hero{height:var(--hero-height)}.gallery{gap:var(--grid-gap)}.hero h1,.gallery-title{font-family:var(--gallery-font)}.photo-actions button{cursor:pointer}.photo-wrap.hidden-favorite{display:none}</style></head><body><header class="hero"><div id="heroImage" class="hero-image"></div><div class="hero-overlay"></div><nav class="topbar"><div class="brand">VIKFILM</div><div>KUNDENGALERIE</div></nav><div class="hero-content"><p class="date" id="date"></p><h1 id="title">VIKFILM</h1><button class="hero-link" onclick="scrollToGallery()">FOTOS ANZEIGEN</button></div></header><section class="gallery-toolbar"><div class="gallery-title"><strong id="toolbarTitle"></strong><span id="favoriteCount">0 FAVORITEN</span></div><div class="actions"><button class="action" id="favBtn" onclick="toggleFavoritesView()"><span class="icon">♡</span><span>FAVORITEN</span></button><button class="action" id="downloadBtn" onclick="downloadFavorites()"><span class="icon">↓</span><span>DOWNLOAD</span></button><button class="action" id="shareBtn" onclick="shareGallery()"><span class="icon">↗</span><span>TEILEN</span></button><button class="action" id="slideBtn" onclick="toggleSlideshow()"><span class="icon">▷</span><span>DIASHOW</span></button></div></section><main id="gallery" class="gallery"></main><div class="lightbox" id="lightbox"><button class="close" onclick="closeLightbox()">×</button><button class="prev" onclick="change(-1)">‹</button><div class="lightbox-content"><div id="lightboxPhoto" class="lightbox-photo"></div><div class="lightbox-controls"><button id="lbFav" onclick="toggleFavorite(current)">♡ FAVORIT</button><button id="lbDown" onclick="downloadCurrent()">↓ DOWNLOAD</button><button onclick="sharePhoto(current)">↗ TEILEN</button></div></div><button class="next" onclick="change(1)">›</button><div id="counter" class="counter"></div></div><footer><div class="brand">VIKFILM</div><span>Photography &amp; Videography</span></footer><script>
const KEY='vikfilmDB';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{galleries:[]};const requested=new URLSearchParams(location.search).get('gallery');let gallery=db.galleries.find(g=>g.id===requested||g.slug===requested)||db.galleries[0]||null;let photos=[],favorites=new Set(),current=0,slideTimer=null,favoriteOnly=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function scrollToGallery(){document.getElementById('gallery').scrollIntoView({behavior:'smooth'})}function favKey(){return 'vikfilmFav_'+(gallery?.id||'default')}function loadFav(){favorites=new Set(JSON.parse(localStorage.getItem(favKey())||'[]'))}function saveFav(){localStorage.setItem(favKey(),JSON.stringify([...favorites]));if(gallery)gallery.favorites=favorites.size;save();updateUI()}function toggleFavorite(i){favorites.has(i)?favorites.delete(i):favorites.add(i);saveFav()}function toggleFavoritesView(){favoriteOnly=!favoriteOnly;document.getElementById('favBtn').classList.toggle('active',favoriteOnly);updateUI()}function updateUI(){document.getElementById('favoriteCount').textContent=favorites.size+' FAVORITEN';document.querySelectorAll('.photo-wrap').forEach((w,i)=>w.classList.toggle('hidden-favorite',favoriteOnly&&!favorites.has(i)));document.querySelectorAll('[data-fav]').forEach(b=>b.textContent=favorites.has(+b.dataset.fav)?'♥':'♡');document.getElementById('lbFav').textContent=favorites.has(current)?'♥ FAVORIT':'♡ FAVORIT'}async function shareGallery(){try{await navigator.share({title:gallery?.name||'VikFilm Galerie',text:'Unsere Galerie bei VikFilm',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);alert('Galerie-Link kopiert.')}catch(e){}}}async function sharePhoto(i){let u=location.href.split('#')[0]+'#foto-'+(i+1);try{await navigator.share({title:(gallery?.name||'VikFilm')+' – Foto '+(i+1),url:u})}catch(e){navigator.clipboard?.writeText(u)}}function applyDesign(){let d=gallery?.design||{};document.documentElement.style.setProperty('--hero-height',(d.hero||78)+'vh');document.documentElement.style.setProperty('--grid-gap',(d.gap??4)+'px');let f={'Modern Sans':'Arial,sans-serif','Elegant Serif':'Playfair Display,Georgia,serif','Classic':'Georgia,serif','Romantic Script':'cursive'};document.documentElement.style.setProperty('--gallery-font',f[d.font]||f['Elegant Serif']);document.documentElement.dataset.preset=d.preset||'Editorial'}function build(){if(!gallery){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Arial"><div><h1>Keine Galerie gefunden</h1><p>Öffne die Galerie aus dem VikFilm Studio.</p></div></main>';return}if(gallery.status==='offline'){document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font-family:Arial;text-align:center"><div><h1>Galerie nicht verfügbar</h1><p>Diese Galerie ist momentan offline.</p></div></main>';return}document.title=(gallery.name||'VikFilm Galerie')+' – VikFilm';document.getElementById('title').textContent=(gallery.name||'VIKFILM').toUpperCase();document.getElementById('toolbarTitle').textContent=(gallery.name||'VIKFILM').toUpperCase();document.getElementById('date').textContent=gallery.date?new Date(gallery.date+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):'';photos=gallery.photos||[];if(!photos.length)photos=[1,2,3,4,5,6].map(n=>({url:'',name:'Beispielfoto '+n,cls:'photo-'+n}));loadFav();const el=document.getElementById('gallery');el.innerHTML='';photos.forEach((p,i)=>{let w=document.createElement('div');w.className='photo-wrap';let b=document.createElement('button');b.className='photo '+(p.cls||'');b.type='button';if(p.url)b.style.backgroundImage=`url(${p.url})`;b.style.backgroundSize='cover';b.style.backgroundPosition='center';b.onclick=()=>openPhoto(i);let a=document.createElement('div');a.className='photo-actions';a.innerHTML=`<button data-fav="${i}" title="Favorit">♡</button><button title="Download">↓</button><button title="Teilen">↗</button>`;a.children[0].onclick=e=>{e.stopPropagation();toggleFavorite(i)};a.children[1].onclick=e=>{e.stopPropagation();downloadIndex(i)};a.children[2].onclick=e=>{e.stopPropagation();sharePhoto(i)};w.append(b,a);el.appendChild(w)});applyDesign();if(gallery.features?.fav===false||gallery.allowFavorites===false)document.getElementById('favBtn').style.display='none';if(gallery.features?.down===false||gallery.allowDownloads===false)document.getElementById('downloadBtn').style.display='none';if(gallery.features?.share===false)document.getElementById('shareBtn').style.display='none';if(gallery.features?.slide===false)document.getElementById('slideBtn').style.display='none';updateUI()}function openPhoto(i){current=i;showLightbox();document.getElementById('lightbox').classList.add('show')}function showLightbox(){let p=photos[current],b=document.getElementById('lightboxPhoto');b.className='lightbox-photo '+(p.cls||'');b.style.backgroundImage=p.url?`url(${p.url})`:'';b.style.backgroundSize='contain';b.style.backgroundPosition='center';b.style.backgroundRepeat='no-repeat';document.getElementById('counter').textContent=(current+1)+' / '+photos.length;document.getElementById('lbDown').style.display=(gallery.features?.down===false||gallery.allowDownloads===false)?'none':'';updateUI()}function closeLightbox(){document.getElementById('lightbox').classList.remove('show');stopSlideshow()}function change(n){current=(current+n+photos.length)%photos.length;showLightbox()}function toggleSlideshow(){if(slideTimer){stopSlideshow();return}document.getElementById('lightbox').classList.add('show');current=0;showLightbox();slideTimer=setInterval(()=>change(1),3500);document.getElementById('slideBtn').classList.add('active')}function stopSlideshow(){clearInterval(slideTimer);slideTimer=null;document.getElementById('slideBtn')?.classList.remove('active')}function downloadIndex(i){if(gallery.features?.down===false||gallery.allowDownloads===false)return;let p=photos[i];if(!p?.url){alert('Beispielbild – füge im Studio echte Bilder hinzu.');return}let a=document.createElement('a');a.href=p.url;a.download=p.name||'VikFilm-Foto';a.click();gallery.downloads=(gallery.downloads||0)+1;save()}function downloadCurrent(){downloadIndex(current)}function downloadFavorites(){if(!favorites.size){alert('Wählt zuerst eure Lieblingsbilder aus.');return}favorites.forEach(i=>downloadIndex(i))}document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('show'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});build();</script></body></html>
